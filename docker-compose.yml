version: '3.8'

services:
  panchayat:
    build: .
    container_name: panchayat_server
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      # Mount the data directory so that records like solana notary ledger 
      # and shield audit logs persist across container restarts.
      - ./data:/app/data
    restart: unless-stopped
